# 智觅 —— 一键起全栈
#
#     docker compose up -d --build
#     # 浏览器打开 http://127.0.0.1:8080
#
# ## 起来的是什么
#
#     mysql         :3306   业务数据（容器内建库 + 建表）
#     redis         :6379   限流计数 + 会话缓存（AI 服务的运维态）
#     book-service  :8080   Java 主服务（业务逻辑 / 事务 / REST）
#     ai-service    :8000   Python AI 服务（抽取 / 检索 / 对话）
#
# ## ⚠️ 第一次起来之后，还要做两步「人做」的事
#
# 1. **灌数据。** compose 只建了**空表**（schema.sql 是 DDL，没有数据）。
#    要试搜书得先有帖子：见 README「灌数据」一节。
#    1 万条语料的生成要真调 LLM，**这一步不能在容器里自动做** —— 它花钱。
# 2. **建索引。** `curl -X POST localhost:8000/index/build -H 'Content-Type: application/json' -d '{}'`
#    不建索引的话 /search 永远返回空（那是**正常**结果，不是 bug）。
#
# ## ⚠️ 坑一：`.env` 的位置和你想的不一样
#
# Compose 只读**项目根目录**（本文件旁边）的 `.env`，
# 而 AI 服务的 `.env` 在 `ai-service/.env` —— **它不会被自动读到**。
#
# 所以要么在根目录放一个 `.env`（至少要有 LLM_API_KEY）：
#
#     LLM_API_KEY=sk-xxxx
#     VISION_API_KEY=          # 可选，不填就以图搜书返回 503
#     DB_PASSWORD=123456
#     REDIS_PASSWORD=123456
#
# 要么直接在命令行前面带上：`LLM_API_KEY=sk-xxx docker compose up -d`
#
# ## ⚠️ 坑二：这份 compose **没有在真机上跑过**
#
# 写它的时候本机没装 Docker Desktop，所以语法和配置都是照着两边 Dockerfile 的
# 实际内容推的，**没有实跑验证**。第一次用请把日志打开看：
#
#     docker compose up --build        # 前台起，报错直接看得见
#
# 最可能出问题的地方已经尽量标在注释里了，遇到问题先看那一节。

name: zhimi

services:
  # ==========================================================================
  # MySQL
  # ==========================================================================
  mysql:
    image: mysql:8.0
    # 宿主机端口**刻意不映射到 3306**。
    # 本机的 MySQL 已经占着 3306 了，直接映射会「端口被占用」起不来；
    # 而且真映射出去，容器里的库和本机那个容易搞混（连错库查半天）。
    # 需要从宿主机连容器里的库时用 13306。
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: book_agent
      # 中文/emoji 都要能存 —— 和 schema.sql 里的 utf8mb4 对齐
      LANG: C.UTF-8
    command:
      # mysql:8 默认的 utf8mb3 存不下 emoji，建库建表前先把服务端字符集定死
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # /docker-entrypoint-initdb.d 里的 .sql 会在**数据目录为空时**自动执行一次。
      # 注意「为空时」三个字：mysql_data 卷里已经有数据的话，这文件不会再跑 ——
      # 改了 schema.sql 想生效得先 `docker compose down -v`（-v 会删数据卷）。
      - ./book-service/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # ⚠️ 这个健康检查**不能省**，而且必须是 mysqladmin ping 而不是「端口通不通」。
      #    MySQL 启动分两段：先 bind 端口，再初始化数据目录（要十几秒）。
      #    用端口判活的话，book-service 会在「端口通了但库还没建好」时启动，
      #    直接连库失败退出 —— 报错还只是莫名其妙的 Access denied。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Redis（AI 服务的限流 + 会话缓存）
  # ==========================================================================
  redis:
    image: redis:7-alpine
    ports:
      # 同样避开本机那个 Redis（6379），映射到 16379
      - "16379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Java 主服务
  # ==========================================================================
  book-service:
    build:
      context: ./book-service
    ports:
      - "8080:8080"
    environment:
      # ---- 数据库连接**全部靠环境变量注入** ----
      #
      # application.yml 里写的是 `127.0.0.1:3306`，那是给「本机直接跑」用的。
      # 容器里 127.0.0.1 指的是**容器自己**，必须换成服务名 mysql。
      # 这正是「同一个镜像连不同的库」的价值：换环境只改这里，镜像不用重建。
      #
      # Spring Boot 的 relaxed binding 会把 SPRING_DATASOURCE_URL
      # 映射到 spring.datasource.url（同名属性本来就存在，这里是覆盖它）。
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/book_agent?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      # application.yml 里是 `password: ${DB_PASSWORD:CHANGE_ME}` —— 同一个变量名，
      # 本机从 .env 读、这里从 compose 注入，两处口径一致
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      # 主服务回调 AI 服务：容器内用**服务名**，不是 127.0.0.1
      AI_SERVICE_BASE_URL: http://ai-service:8000
    depends_on:
      mysql:
        # 等健康检查过，不是等容器起来 —— 两者差十几秒，见上面 mysql 的注释
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Python AI 服务
  # ==========================================================================
  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    environment:
      # ⚠️ 这几个 key 从**宿主机环境变量或同级 .env** 读，不写在文件里。
      #    没配 LLM_API_KEY 的话服务能起，但 /extract 会 500（报错直指 key）。
      LLM_API_KEY: ${LLM_API_KEY:?必须在 .env 或环境变量里设置 LLM_API_KEY}
      # 容器内用服务名 —— 写 127.0.0.1 会去连容器自己，报「连不上主服务」
      BOOK_SERVICE_URL: http://book-service:8080
      REDIS_URL: redis://:${REDIS_PASSWORD:-123456}@redis:6379/0

      # 视觉模型：不配也能跑，/search/by-image 会回 503（其余功能全正常）
      VISION_API_KEY: ${VISION_API_KEY:-}

      # 模型缓存目录 = 挂进来的宿主机 models/，见下面 volumes。
      # 不挂的话每次重建容器都要重下 1.2GB。
      HF_HOME: /app/models
    volumes:
      # ---- 模型权重（1.2GB）----
      # 从宿主机挂进去，**不烤进镜像**：1.1GB 的 rerank 权重进不了 Git
      # （GitHub 单文件上限 100MB），也不该进镜像层（镜像会胖到没法推）。
      # rerank.py 找的就是 /app/models/bge-reranker-base/config.json。
      - ./ai-service/models:/app/models
      # ---- 向量库 ----
      # 不挂的话 `docker compose down` 一次，1 万条向量就没了，得重新建（23 秒 + 重跑 embedding）
      - chroma_data:/app/data
    depends_on:
      # AI 服务启动不强依赖主服务活着（起不来它照样能跑，只是 /chat 会 503），
      # 但索引构建和 /chat 都要用，所以等它起来，少一段「刚起来就报错」的困惑期
      book-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  chroma_data:
